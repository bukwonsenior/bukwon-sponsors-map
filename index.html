<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>북원노인종합복지관 후원업체 지도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
  
  #container {
    display: flex; flex-direction: column;
    width: 100%; height: 100vh;
  }
  
  /* ★ 지도+패널 2분할 영역 */
  #map-section {
    position: relative;
    width: 100%; height: 55%; min-height: 300px;
    display: flex;
  }
  #map-wrap {
    flex: 6; position: relative; min-height: 300px;
  }
  #map { width: 100%; height: 100%; }
  
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: #fff; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 13px;
  }
  #panel strong { color: #d4a017; font-size: 14px; }
  
  #search {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    width: 220px; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 100; background: rgba(255,255,255,0.95); padding: 20px 30px;
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    font-size: 14px;
  }

  /* ★ 오른쪽 소개 패널 */
  #detail-panel {
    flex: 4; border-left: 1px solid #ddd; background: #fff;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  #detail-panel.empty {
    align-items: center; justify-content: center;
  }
  .detail-placeholder {
    text-align: center; color: #bbb; padding: 20px;
  }
  .detail-placeholder .icon { font-size: 36px; margin-bottom: 8px; }
  .detail-placeholder .text { font-size: 13px; }

  .detail-header {
    padding: 16px 18px 12px; border-bottom: 1px solid #f0f0f0;
  }
  .detail-header .top {
    display: flex; align-items: center; gap: 10px;
  }
  .detail-header .dh-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: #EA580C; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0;
  }
  .detail-header .dh-name {
    font-size: 16px; font-weight: bold; color: #222;
  }
  .detail-header .dh-cat {
    display: inline-block; background: #FFF7ED; color: #b8860b;
    padding: 2px 10px; border-radius: 10px; font-size: 11px; margin-top: 3px;
  }

  .detail-body { padding: 16px 18px; flex: 1; }
  .detail-row {
    display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px;
  }
  .detail-row .lbl {
    color: #999; min-width: 42px; flex-shrink: 0; font-size: 12px;
  }
  .detail-row .val { color: #333; }
  .detail-row .val a { color: #185FA5; text-decoration: none; }
  .detail-row .val a:hover { text-decoration: underline; }

  .detail-divider {
    border-top: 1px solid #f0f0f0; padding-top: 14px; margin-top: 10px;
  }
  .detail-divider .section-title {
    font-size: 13px; font-weight: bold; color: #9A3412; margin-bottom: 8px;
  }
  .detail-divider .desc {
    font-size: 12px; color: #555; line-height: 1.8;
  }

  .detail-actions {
    padding: 12px 18px; border-top: 1px solid #f0f0f0;
    display: flex; gap: 8px;
  }
  .detail-actions a {
    flex: 1; text-align: center; padding: 9px;
    background: #FFF7ED; border-radius: 6px;
    font-size: 12px; color: #EA580C; font-weight: bold;
    text-decoration: none; cursor: pointer;
    transition: background 0.15s;
  }
  .detail-actions a:hover { background: #ffe9a8; }
  
  /* 기존 InfoWindow */
  .info-window {
    padding: 12px 14px; width: 300px;
    font-size: 13px; line-height: 1.6; word-break: keep-all;
    overflow: visible;
  }
  .info-window .name { font-weight: bold; font-size: 15px; color: #333; margin-bottom: 6px; }
  .info-window .category {
    display: inline-block; background: #fff4d6; color: #b8860b;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-bottom: 8px;
  }
  .info-window .row { color: #555; margin-top: 4px; }
  .info-window .row b { color: #888; display: inline-block; width: 40px; }
  
  /* 명단 영역 */
  #list-section {
    width: 100%; height: 45%; min-height: 200px;
    overflow-y: auto; background: #fafafa;
    border-top: 2px solid #e0e0e0;
  }
  #list-header {
    padding: 10px 16px; background: #fff;
    border-bottom: 1px solid #e0e0e0;
    font-weight: bold; font-size: 14px; color: #333;
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
  }
  #list-header .count-badge {
    display: inline-block; background: #d4a017; color: #fff;
    padding: 2px 10px; border-radius: 12px; font-size: 12px;
  }
  
  .sort-area {
    margin-left: auto; display: flex; gap: 4px;
  }
  .sort-btn {
    padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
    background: #fff; font-size: 11px; color: #555;
    cursor: pointer; transition: all 0.15s;
  }
  .sort-btn:hover { background: #f5f5f5; }
  .sort-btn.active {
    background: #d4a017; color: #fff; border-color: #d4a017;
  }
  
  .list-item {
    padding: 12px 16px; border-bottom: 1px solid #ececec;
    cursor: pointer; transition: background 0.15s;
    display: flex; align-items: center; gap: 12px;
  }
  .list-item:hover { background: #fff4d6; }
  .list-item.active { background: #ffe9a8; }
  
  .list-item .icon {
    width: 28px; height: 28px; flex-shrink: 0;
    background: #d4a017; color: #fff;
    border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
    font-size: 14px;
  }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .info .name {
    font-weight: bold; font-size: 14px; color: #222;
    margin-bottom: 2px;
  }
  .list-item .info .meta {
    font-size: 12px; color: #777;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .info .meta .cat {
    color: #b8860b; margin-right: 6px;
  }
  
  .empty-msg {
    padding: 30px; text-align: center; color: #999; font-size: 13px;
  }

  /* ★ 모바일: 세로 배치 */
  @media (max-width: 768px) {
    #map-section { flex-direction: column; height: auto; }
    #map-wrap { min-height: 300px; height: 50vw; max-height: 400px; }
    #detail-panel {
      border-left: none; border-top: 1px solid #ddd;
      min-height: auto;
    }
    #detail-panel.empty { min-height: 80px; }
    #search { width: 160px; font-size: 12px; }
    #panel { font-size: 12px; padding: 8px 10px; }
    .list-item .info .meta { font-size: 11px; }
    .sort-btn { font-size: 10px; padding: 3px 7px; }
  }
</style>
</head>
<body>

<div id="container">
  <div id="map-section">
    <!-- 왼쪽: 지도 -->
    <div id="map-wrap">
      <div id="map"></div>
      <div id="panel">
        <strong>&#9829; 북원노인종합복지관</strong><br>
        후원업체 <span id="count">0</span>곳
      </div>
      <input type="text" id="search" placeholder="&#128269; 업체명·업종 검색">
      <div id="loading">지도를 불러오는 중...</div>
    </div>

    <!-- 오른쪽: 소개 패널 -->
    <div id="detail-panel" class="empty">
      <div class="detail-placeholder">
        <div class="icon">&#9829;</div>
        <div class="text">업체를 선택하면<br>상세 정보가 표시됩니다</div>
      </div>
    </div>
  </div>
  
  <div id="list-section">
    <div id="list-header">
      후원업체 명단
      <span class="count-badge" id="list-count">0</span>
      <div class="sort-area">
        <button class="sort-btn" data-sort="name">가나다순</button>
        <button class="sort-btn" data-sort="category">업종별</button>
      </div>
    </div>
    <div id="list-items"></div>
  </div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3e728a6e83cb38eec3d7a2321a5f0847&autoload=false"></script>
<script>
const CENTER = { lat: 37.3422, lng: 127.9202 };

const CATEGORY_ICONS = {
  '음식점': '&#127869;', '카페': '&#9749;', '마트': '&#128722;', '병원': '&#127973;',
  '약국': '&#128138;', '미용실': '&#9986;', '세탁': '&#128084;', '학원': '&#128218;',
  '은행': '&#127974;', '교회': '&#9961;', '사찰': '&#128341;', '기업': '&#127970;',
  '공장': '&#127981;', '기관': '&#127963;'
};

function getCategoryIcon(cat) {
  if (!cat) return '&#9829;';
  for (const [key, icon] of Object.entries(CATEGORY_ICONS)) {
    if (cat.includes(key)) return icon;
  }
  return '&#9829;';
}

let map, allMarkers = [], allInfoWindows = [], allData = [], displayData = [], openInfoWindow = null;
let currentSort = 'name';

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lng),
    level: 5
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  loadData();
});

async function loadData() {
  try {
    const res = await fetch('sponsors.json?v=' + Date.now());
    const rows = await res.json();
    
    // 헤더: [연번, 상호명, 업종, 주소, 전화, 위도, 경도, 비고, 후원내용, 소개]
    const data = rows.slice(1).filter(r => r[1] && r[5] && r[6]);
    allData = data;
    displayData = [...data];

    renderMarkers(displayData, false);
    map.setCenter(new kakao.maps.LatLng(CENTER.lat, CENTER.lng));
    map.setLevel(6);
    renderList(displayData);
    updateCounts(displayData.length);
    document.getElementById('loading').style.display = 'none';
    
    if (data.length === 0) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = '등록된 후원업체가 없습니다.';
    }
  } catch (e) {
    document.getElementById('loading').textContent = '데이터 로딩 실패: ' + e.message;
  }
}

function updateCounts(n) {
  document.getElementById('count').textContent = n;
  document.getElementById('list-count').textContent = n;
}

function sortData(data, sortType) {
  const sorted = [...data];
  switch(sortType) {
    case 'name':
      sorted.sort((a, b) => (a[1] || '').localeCompare(b[1] || '', 'ko'));
      break;
    case 'category':
      sorted.sort((a, b) => {
        const catCompare = (a[2] || '').localeCompare(b[2] || '', 'ko');
        if (catCompare !== 0) return catCompare;
        return (a[1] || '').localeCompare(b[1] || '', 'ko');
      });
      break;
    default:
      break;
  }
  return sorted;
}

function renderMarkers(data, fit = true) {
  allMarkers.forEach(m => m.setMap(null));
  allMarkers = [];
  allInfoWindows = [];
  
  const bounds = new kakao.maps.LatLngBounds();
  
  data.forEach((row, idx) => {
    const [no, name, category, addr, tel, lat, lng, memo, support, intro] = row;
    const pos = new kakao.maps.LatLng(parseFloat(lat), parseFloat(lng));
    
    const marker = new kakao.maps.Marker({ position: pos, map: map, title: name });
    bounds.extend(pos);
    
    const html = `
      <div class="info-window">
        <div class="name">${escapeHtml(name)}</div>
        ${category ? `<span class="category">${escapeHtml(category)}</span><br>` : ''}
        <div class="row"><b>주소</b> ${escapeHtml(addr || '-')}</div>
        <div class="row"><b>전화</b> ${tel ? `<a href="tel:${tel}">${escapeHtml(tel)}</a>` : '-'}</div>
        ${memo ? `<div class="row"><b>비고</b> ${escapeHtml(memo)}</div>` : ''}
      </div>
    `;
    
    const infoWindow = new kakao.maps.InfoWindow({ content: html, removable: true, disableAutoPan: false });
    
    kakao.maps.event.addListener(marker, 'click', () => {
      openMarkerInfo(idx);
    });
    
    allMarkers.push(marker);
    allInfoWindows.push(infoWindow);
  });
  
  if (fit && data.length > 1) {
    map.setBounds(bounds);
  } else if (fit && data.length === 1) {
    map.setCenter(new kakao.maps.LatLng(parseFloat(data[0][5]), parseFloat(data[0][6])));
    map.setLevel(4);
  }
}

// ★ 오른쪽 패널 갱신
function updateDetailPanel(row) {
  const [no, name, category, addr, tel, lat, lng, memo, support, intro] = row;
  const dp = document.getElementById('detail-panel');
  dp.classList.remove('empty');

  const catIcon = getCategoryIcon(category);
  const telLink = tel ? `<a href="tel:${escapeHtml(tel)}">${escapeHtml(tel)}</a>` : '-';
  const naverMap = `https://map.naver.com/v5/search/${encodeURIComponent(addr)}`;

  dp.innerHTML = `
    <div class="detail-header">
      <div class="top">
        <div class="dh-icon">${catIcon}</div>
        <div>
          <div class="dh-name">${escapeHtml(name)}</div>
          ${category ? `<div class="dh-cat">${escapeHtml(category)}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-row"><span class="lbl">주소</span><span class="val">${escapeHtml(addr || '-')}</span></div>
      <div class="detail-row"><span class="lbl">전화</span><span class="val">${telLink}</span></div>
      ${support ? `<div class="detail-row"><span class="lbl">후원</span><span class="val">${escapeHtml(support)}</span></div>` : ''}
      ${(intro || memo) ? `
      <div class="detail-divider">
        <div class="section-title">소개</div>
        <div class="desc">${escapeHtml(intro || memo)}</div>
      </div>` : ''}
    </div>
    <div class="detail-actions">
      <a href="${naverMap}" target="_blank" rel="noopener">길찾기</a>
      ${tel ? `<a href="tel:${escapeHtml(tel)}">전화하기</a>` : ''}
    </div>
  `;
}

function renderList(data) {
  const container = document.getElementById('list-items');
  
  if (data.length === 0) {
    container.innerHTML = '<div class="empty-msg">표시할 후원업체가 없습니다.</div>';
    return;
  }
  
  container.innerHTML = data.map((row, idx) => {
    const [no, name, category, addr, tel] = row;
    const icon = getCategoryIcon(category);
    return `
      <div class="list-item" data-idx="${idx}">
        <div class="icon">${icon}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="meta">
            ${category ? `<span class="cat">${escapeHtml(category)}</span>` : ''}
            ${escapeHtml(addr || '')}
          </div>
        </div>
      </div>
    `;
  }).join('');
  
  container.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      openMarkerInfo(idx);
      
      container.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

function openMarkerInfo(idx) {
  if (openInfoWindow) openInfoWindow.close();
  
  const marker = allMarkers[idx];
  const infoWindow = allInfoWindows[idx];
  if (!marker || !infoWindow) return;
  
  map.setLevel(3);
  map.panTo(marker.getPosition());
  
  setTimeout(() => {
    infoWindow.open(map, marker);
    openInfoWindow = infoWindow;
  }, 200);
  
  document.querySelectorAll('.list-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // ★ 오른쪽 패널 갱신
  updateDetailPanel(displayData[idx]);
}

// 검색 필터
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let filtered;
  if (!q) {
    filtered = allData;
  } else {
    filtered = allData.filter(r => 
      (r[1] || '').toLowerCase().includes(q) || 
      (r[2] || '').toLowerCase().includes(q)
    );
  }
  displayData = sortData(filtered, currentSort);
  renderMarkers(displayData);
  renderList(displayData);
  updateCounts(displayData.length);
});

// 정렬 버튼
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSort = btn.dataset.sort;
    
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const q = document.getElementById('search').value.trim().toLowerCase();
    let filtered;
    if (!q) {
      filtered = allData;
    } else {
      filtered = allData.filter(r => 
        (r[1] || '').toLowerCase().includes(q) || 
        (r[2] || '').toLowerCase().includes(q)
      );
    }
    displayData = sortData(filtered, currentSort);
    renderMarkers(displayData);
    renderList(displayData);
    updateCounts(displayData.length);
  });
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
