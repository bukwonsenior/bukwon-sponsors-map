name: 후원처 엑셀을 지도 데이터로 바꾸기

on:
  push:
    paths:
      - "북원_후원업체_지도관리.xlsx"
      - "build_sponsors.py"
      - ".github/workflows/build-sponsors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: 엑셀 읽어서 sponsors.json 만들기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python build_sponsors.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sponsors.json _coords_cache.json _geocode_report.json "북원_후원업체_지도관리.xlsx"
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."; exit 0
          fi
          git commit -m "후원지도 자동 갱신"
          git pull --rebase --autostash origin main
          git push
