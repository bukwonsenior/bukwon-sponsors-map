<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈페이지 편집기 · 북원노인종합복지관</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#E4DCD2;--soft:#FDF0E2;--bg:#F7F4EF;--ok:#2E8B77;--err:#D9483B;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;}
html,body{height:100%;background:var(--bg);color:var(--ink);}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.top h1{font-size:17px;font-weight:800;}
.top select{border:1.5px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:800;color:var(--action);background:var(--soft);cursor:pointer;max-width:260px;}
.top .sp{flex:1;}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--brand);}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.ok{border-color:#2E8B77;color:#2E8B77;}
.btn.sm{font-size:12px;padding:6px 10px;color:#7a6a58;}
.btn.big{font-size:15px;padding:10px 18px;}
.btn.pri.off{background:#cbbfb2;border-color:#cbbfb2;}
.btn:disabled{opacity:.6;cursor:wait;}
.btn input{display:none;}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{border:none;background:#fff;font-weight:700;font-size:13px;padding:8px 13px;cursor:pointer;color:var(--gray);}
.seg button.on{background:var(--brand);color:#fff;}
.wrap{display:flex;height:calc(100vh - 58px);}
.left{width:52%;min-width:440px;overflow:auto;padding:14px 16px 60px;border-right:1px solid var(--line);}
.right{flex:1;overflow:auto;background:#fff;padding:14px;}
.hint{font-size:12.5px;color:var(--gray);margin:2px 0 12px;line-height:1.65;}
.hint b{color:var(--action);} .hint code{background:#efe7da;padding:1px 6px;border-radius:5px;font-size:12px;}
.val{margin:0 0 10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;line-height:1.65;}
.val.ok{background:#E4F1EC;color:var(--ok);} .val.bad{background:#FBE9E7;color:var(--err);} .val.warn{background:#FFF4E0;color:#9A5B00;}
.filebox{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:#fff;border:1px dashed #cdbfa9;border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:12.5px;}
.filebox b{color:var(--action);}
.filebox label{display:flex;align-items:center;gap:6px;font-weight:700;color:#6b5b45;}
.filebox input{border:1.5px solid #e3dccf;border-radius:7px;padding:6px 8px;font-size:13px;width:150px;}
.filebox input[readonly]{background:#f3ede3;color:#8a7a66;}
.filebox .n{flex-basis:100%;font-size:11.5px;color:#a0917d;}
.area{font-size:13px;font-weight:800;color:#8a7a66;margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}
.area::after{content:"";flex:1;height:1px;background:#e0d6c8;}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;background:#fff;border:1.5px solid var(--brand);border-radius:14px;margin-bottom:14px;}
.tabbar .lbl{font-size:12px;font-weight:800;color:var(--action);margin-right:4px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px 8px 14px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--gray);user-select:none;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.chip.over{box-shadow:-4px 0 0 var(--action);}
.chip .x{font-size:15px;opacity:.55;padding:0 2px;} .chip .x:hover{opacity:1;}
.addtab{border:1.5px dashed var(--brand);background:var(--soft);color:var(--action);font-weight:800;font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer;}
.tabtip{flex-basis:100%;font-size:11.5px;color:#a0917d;font-weight:600;margin-top:2px;}
.grp{margin-bottom:18px;background:#fff;border:1px solid var(--line);border-left-width:7px;border-radius:12px;padding:14px 14px 12px;box-shadow:0 2px 10px rgba(120,90,50,.06);}
.grp h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.grp h3 .kt{font-size:11px;font-weight:800;color:#fff;padding:3px 9px;border-radius:20px;}
.grp h3 .cnt{font-size:12px;color:#a0917d;font-weight:700;}
.grp .tip{font-size:11.5px;color:#a0917d;font-weight:600;margin:-4px 0 8px;}
table{width:100%;border-collapse:separate;border-spacing:0;}
th{background:#f3ede3;font-size:12px;font-weight:800;color:#6b5b45;padding:8px 7px;text-align:left;}
td{border-top:1px solid #eee5d8;padding:8px 6px;vertical-align:top;}
tbody tr:nth-child(even) td{background:#faf7f2;}
tr.off td{opacity:.45;}
td input,td textarea,td select{width:100%;border:1.5px solid #e3dccf;border-radius:7px;padding:8px 9px;font-size:13.5px;background:#fff;resize:vertical;}
td input:focus,td textarea:focus,td select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(243,129,0,.14);}
td textarea{min-height:40px;line-height:1.45;}
.c-h{width:24px;}.c-g{width:58px;}.c-ic{width:74px;}.c-x{width:34px;}
.drag{cursor:grab;color:#c9beac;font-size:17px;text-align:center;user-select:none;padding-top:14px!important;}
tr.dragging{opacity:.35;} tr.over td{box-shadow:inset 0 3px 0 var(--brand);}
.del{border:1px solid #f0d5d0;background:#fff;color:var(--err);font-size:15px;font-weight:800;cursor:pointer;width:30px;height:34px;border-radius:7px;}
.del:hover{background:#FBE9E7;}
.addrow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.addrow button,.addrow label{border:1.5px dashed var(--line);background:#fff;color:var(--gray);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;}
.addrow button:hover,.addrow label:hover{border-color:var(--brand);color:var(--action);}
.addrow input{display:none;}
.one{font-size:12px;color:#a0917d;font-weight:600;margin-top:8px;}
.icbtn{display:flex;align-items:center;justify-content:center;width:100%;border:1.5px solid #e3dccf;border-radius:7px;background:#fff;padding:5px;cursor:pointer;min-height:38px;}
.icbtn:hover{border-color:var(--brand);}
.icbtn svg{width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.icbtn .none{font-size:11.5px;color:#b0a896;font-weight:700;}
#icpop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:10px;display:none;grid-template-columns:repeat(8,44px);gap:5px;}
#icpop button{width:44px;height:48px;border:1px solid #eee5d8;border-radius:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
#icpop button svg{width:21px;height:21px;stroke:var(--action);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#icpop button span{font-size:9.5px;color:#8a7a66;font-weight:700;}
#icpop button:hover{border-color:var(--brand);background:var(--soft);}
#icpop .none{grid-column:1/-1;height:auto;font-size:12px;font-weight:700;color:var(--gray);padding:7px;flex-direction:row;}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#faf7f2;position:relative;}
.ph.off{opacity:.45;}
.ph img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#efe9df;}
.ph .noimg{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#efe9df;color:#a0917d;font-size:11.5px;font-weight:700;text-align:center;padding:6px;}
.ph .new{position:absolute;top:6px;left:6px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:9px;}
.ph .pbtn{position:absolute;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:13px;font-weight:800;cursor:pointer;}
.ph .pdel{right:6px;} .ph .pl{right:62px;} .ph .pr{right:34px;}
.ph .info{padding:7px;display:flex;flex-direction:column;gap:5px;}
.ph .info input{width:100%;border:1px solid #e3dccf;border-radius:6px;padding:6px;font-size:12px;}
.ph .info select{border:1px solid #e3dccf;border-radius:6px;padding:4px;font-size:12px;}
.empty{padding:50px 20px;text-align:center;color:var(--gray);font-weight:700;line-height:1.8;}
.pvhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gray);font-weight:700;margin-bottom:8px;flex-wrap:wrap;}
#hbox{font-size:12px;font-weight:700;}
#hbox .bad{color:var(--err);} #hbox .ok{color:var(--ok);}
#pvbox{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;}
#pv{border:0;display:block;transform-origin:top left;background:#fff;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2B2320;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:700;line-height:1.6;display:none;z-index:99;max-width:680px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.thumbs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid #e4dcd2}.thumbs .noimg{font-size:11px;color:#b45309;background:#fff7ed;border-radius:6px;padding:4px 6px;max-width:150px}.tadd{cursor:pointer;font-size:20px;padding:2px 6px;border:1px dashed #ccc;border-radius:6px}.tadd input{display:none}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px}.fgrid .fl{display:flex;flex-direction:column;font-size:11.5px;color:#8a7a66;gap:2px}.fgrid .fl.w2{grid-column:span 2}.fgrid input,.fgrid select{width:100%}td.ro{font-weight:700;color:#5a4a3a;font-size:13px;white-space:nowrap}.chip small{opacity:.7;font-weight:600}
</style></head>
<body>
<div class="top">
  <h1>홈페이지 편집기</h1>
  <select id="pagesel"></select>
  <button class="btn" id="loadlive">🌐 현재 홈페이지 내용 불러오기</button>
  <label class="btn">📂 내 엑셀 열기<input type="file" id="file" accept=".xlsx"></label>
  <div class="seg" id="devseg"><button data-d="pc" class="on">PC 화면</button><button data-d="mo">모바일</button></div>
  <div class="sp"></div>
  <button class="btn sm" id="ghset" title="관리자용: 이 PC를 홈페이지(GitHub)와 연결">⚙ <span id="ghst">관리자 설정</span></button>
  <button class="btn sm" id="dl" title="엑셀 파일로 저장 (연결 안 된 PC에서 관리자에게 전달할 때)">💾 엑셀로 저장</button>
  <button class="btn pri big" id="ghup">⬆ 홈페이지에 올리기</button>
</div>
<div class="wrap">
  <div class="left">
    <div class="hint" id="hint"></div>
    <div id="valbox"></div>
    <div id="editor"></div>
  </div>
  <div class="right">
    <div class="pvhead"><span id="pvtitle">실제 홈페이지 미리보기</span><span id="hbox"></span></div>
    <div id="pvbox"><iframe id="pv" title="미리보기"></iframe></div>
  </div>
</div>
<div id="icpop"></div>
<div id="toast"></div>

function saeopBuild(rows,url){
  var tabs=[],ti={},gname='';
  rows.forEach(function(r){
    if(isX(r))return; if(r[11])gname=r[11];
    var tab=r[1],k=r[2],label=r[3],text=r[4],tel=r[5],icon=r[6];
    if(!tab||!r[10]||SAEOP_TAB.every(function(s){return s.k!==k;}))return;
    if(!(tab in ti)){ti[tab]=tabs.length;tabs.push({이름표:tab,제목:tab});}
    var t=tabs[ti[tab]];
    if(k==='부제')t.부제=text; else if(k==='설명')t.설명=text;
    else if(k==='정보'){ if(!label)return; var it={라벨:label,값:text,icon:icon||guessIcon(label)};
      if(tel)it.tel=tel; else if(/문의|전화/.test(label)){var mm=text.match(/0\d{1,2}[-. )]*\d{3,4}[-. ]*\d{4}/);if(mm)it.tel=mm[0];}
      (t.정보=t.정보||[]).push(it); }
    else if(k==='절차제목')t.절차제목=text;
    else if(k==='절차'){if(!label)return;(t.절차=t.절차||[]).push({제목:label,설명:text});}
    else if(k==='안내')t.안내=text;
    else if(k==='내용제목')t.내용제목=text;
    else if(k==='내용'){if(!label)return;var a=(t.내용=t.내용||[]);if(a.length&&a[a.length-1].소제목===label)a[a.length-1].항목.push(text);else a.push({소제목:label,항목:text?[text]:[]});}
    else if(k==='사진'){if(!text)return;(t.사진=t.사진||[]).push({파일:url(r,text),캡션:label});}
  });
  return {대분류:gname||P.name,문의전화:'033-747-0516',탭:tabs};
}

var origWB=null;
function readWorkbook(buf,from){
  var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  if(P.readWB){try{rows=P.readWB(wb);}catch(e){alert('엑셀을 읽지 못했어요: '+e+'\n'+P.name+' 페이지 엑셀이 맞는지 확인해 주세요.');return;}
    origWB=wb;blobs.clear();dirty=false;curTab=tabNames()[0]||'';lastHi=null;if(P.afterLoad)P.afterLoad();buildEditor();render(true);toast('✅ '+from+' 불러왔어요 ('+rows.length+'줄)');return;}
  var ws=wb.Sheets[P.sheet]||wb.Sheets[wb.SheetNames.filter(function(n){return n!=='사용법';})[0]];
  var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  var hi=aoa.findIndex(function(r){var m=r.map(function(x){return String(x).trim();});return m.indexOf(P.headKey)>=0&&m.indexOf('게시')>=0;});
  if(hi<0){alert('엑셀에서 머리글(게시·'+P.headKey+'…) 줄을 찾지 못했어요. '+P.name+' 페이지 엑셀이 맞는지 확인해 주세요.');return;}
  var H=aoa[hi].map(function(x){return String(x).trim();});
  var col=P.map.map(function(m){var names=[m[0]].concat(m[2]||[]);for(var i=0;i<names.length;i++){var j=H.indexOf(names[i]);if(j>=0)return j;}return -1;});
  var old=!!P.migrate&&H.indexOf('탭')<0, out=[];
  for(var i=hi+1;i<aoa.length;i++){
    var row=aoa[i];if(!row||!row.some(function(c){return String(c).trim();}))continue;
    var r=[];for(var s=0;s<P.nslots;s++)r.push('');
    P.map.forEach(function(m,j){if(col[j]>=0&&row[col[j]]!=null)r[m[1]]=String(row[col[j]]).trim();});
    if(!r[0])r[0]='O';
    if(P.fixedKind)r[2]=P.fixedKind;
    if(old&&P.migrate[r[2]]){r[1]=P.migrate[r[2]][0];r[2]=P.migrate[r[2]][1];}
    out.push(r);
  }
  rows=out;origWB=wb;blobs.clear();dirty=false;curTab=tabNames()[0]||'';lastHi=null;
  if(P.afterLoad)P.afterLoad();
  buildEditor();render(true);
  toast('✅ '+from+' 불러왔어요 ('+rows.length+'줄)'+(old?'<br>옛날 형식이라 새 형식(탭 칸 포함)으로 바꿔서 열었어요.':''));
}

  fetch(rawBase()+P.xlsx.split('/').map(encodeURIComponent).join('/')+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(function(b){readWorkbook(b,'현재 홈페이지 내용을');})
    .catch(function(){alert('홈페이지 엑셀을 불러오지 못했어요. 인터넷을 확인하거나 [📂 내 엑셀 열기]를 이용해 주세요.');});

/* ================= 편집 화면 ================= */
function buildEditor(){
  var tabs=tabNames(); if(tabs.indexOf(curTab)<0)curTab=tabs[0]||'';
  var h='';
  if(P.fileFields.length){
    h+='<div class="filebox"><b>이 파일 설정</b>';
    P.fileFields.forEach(function(f){h+='<label>'+f.h+'<input data-slot="'+f.slot+'" value="'+esc(fileVal(f.slot))+'"'+(f.ro?' readonly':'')+'></label>';});
    h+=(P.fileNote?'<div class="n">'+P.fileNote+'</div>':'')+'</div>';
  }
  var topUp=P.top.filter(function(s){return !s.bottom;}), topDn=P.top.filter(function(s){return s.bottom;});
  if(topUp.length){h+='<div class="area">페이지 공통 · 위쪽</div>';topUp.forEach(function(s){h+=group(s,'top','');});}
  var TW=P.tabWord;h+='<div class="area">'+TW+' ('+tabs.length+'개)</div><div class="tabbar" id="tabbar"><span class="lbl">'+TW+'</span>';
  tabs.forEach(function(t){var n=rows.filter(function(r){return r[1]===t;}).length;h+='<div class="chip'+(t===curTab?' on':'')+'"'+(P.fixedTabs?'':' draggable="true"')+' data-t="'+esc(t)+'">'+esc(t)+(P.fixedTabs?' <small>'+n+'</small>':'<span class="x" title="'+TW+' 삭제" data-del="1">&times;</span>')+'</div>';});
  h+=P.fixedTabs?'</div>':'<div class="addtab" id="addtab">+ '+TW+' 추가</div><div class="tabtip">클릭=선택 · 더블클릭=이름 바꾸기 · 끌어서 순서 변경 · ×=삭제</div></div>';
  if(curTab)P.tab.forEach(function(s){h+=group(s,'tab',curTab);});
  else h+='<div class="empty" style="padding:24px">아직 '+P.tabWord+'이(가) 없어요. <b>[+ '+P.tabWord+' 추가]</b>로 만들어 주세요.</div>';
  if(topDn.length){h+='<div class="area">페이지 공통 · 아래쪽</div>';topDn.forEach(function(s){h+=group(s,'top','');});}
  document.getElementById('editor').innerHTML=h;
  bindTabbar();
  document.querySelectorAll('.filebox input:not([readonly])').forEach(function(inp){
    inp.addEventListener('input',function(){var sl=+inp.dataset.slot,v=inp.value,hit=0;rows.forEach(function(r){if(r[sl]){r[sl]=v;hit=1;}});if(!hit&&rows[0])rows[0][sl]=v;mark();render();});
  });
}
function group(s,area,tab){
  var c=COLOR[s.k]||'#999', list=[];

  var h='<div class="grp" style="border-left-color:'+c+'"><h3 style="color:'+c+'">'+s.label+'<span class="kt" style="background:'+c+'">'+s.k+'</span><span class="cnt">'+(list.length?list.length+'개':'')+'</span></h3>'+(s.tip?'<div class="tip">'+s.tip+'</div>':'');
  if(s.photo){
    h+='<div class="photos">';
    list.forEach(function(i){var r=rows[i],f=pf(r),b=blobs.get(r);
      h+='<div class="ph'+(isX(r)?' off':'')+'" data-i="'+i+'">'
        +(b?'<img src="'+esc(b)+'"><span class="new">새 사진</span>':(f?'<img src="'+esc(LIVE+P.img+encodeURIComponent(f))+'" data-f="'+esc(f)+'" onerror="imgFail(this)">':'<div class="noimg">파일명 없음</div>'))
        +'<button class="pbtn pl" title="앞으로" onclick="movePhoto('+i+',-1)">‹</button><button class="pbtn pr" title="뒤로" onclick="movePhoto('+i+',1)">›</button><button class="pbtn pdel" title="삭제" onclick="delRow('+i+')">×</button>'
        +'<div class="info"><input placeholder="파일명" value="'+esc(f)+'" oninput="upd('+i+','+P.photo.file+',this.value)"><input placeholder="사진 설명(캡션)" value="'+esc(r[P.photo.cap])+'" oninput="upd('+i+','+P.photo.cap+',this.value)">'
        +'<select onchange="upd('+i+',0,this.value,1)"><option'+(isX(r)?'':' selected')+'>O</option><option'+(isX(r)?' selected':'')+'>X</option></select></div></div>';
    });
    return h+'</div><div class="addrow"><label>📷 사진 추가<input type="file" accept="image/*" multiple onchange="addPhotos(this.files);this.value=\'\'"></label><span class="one">가로 4:3, 2MB 이하 jpg 권장 · 사진 파일은 GitHub <b>'+P.img+'</b>에 같은 이름으로 올려야 해요</span></div></div>';
  }
  h+='<table><thead><tr><th class="c-h"></th><th class="c-g">'+(s.fixed||s.noPub?'':'게시')+'</th>';
  if(s.form)h+='<th>'+s.label+' 정보</th>';else s.cols.forEach(function(col){h+=col.icon?'<th class="c-ic">아이콘</th>':'<th>'+col.h+'</th>';});
  h+='<th class="c-x"></th></tr></thead><tbody>';
  list.forEach(function(i){h+=rowHTML(s,i);});
  h+='</tbody></table>';
  if(s.fixed)h+='';
  else if(s.single&&list.length)h+='<div class="one">이 항목은 한 줄만 사용해요.</div>';
  else h+='<div class="addrow"><button data-k="'+esc(s.k)+'" data-t="'+(area==='top'?'':esc(tab))+'" onclick="addRow(this.dataset.k,this.dataset.t)">+ '+s.label.replace(/ \(.*\)$/,'')+(s.single?' 작성':' 줄 추가')+'</button></div>';
  return h+'</div>';
}
function rowHTML(s,i){
  var r=rows[i],drag=!s.single&&!s.fixed;
  var h='<tr data-i="'+i+'"'+(isX(r)?' class="off"':'')+(drag?' ondragover="rowOver(event,'+i+')" ondragleave="this.classList.remove(\'over\')" ondrop="rowDrop(event,'+i+')"':'')+'>';
  h+=drag?'<td class="drag" draggable="true" ondragstart="rowStart(event,'+i+')" ondragend="rowEnd()" title="끌어서 순서 변경">⠿</td>':'<td></td>';
  h+=(s.fixed||s.noPub)?'<td></td>':'<td><select onchange="upd('+i+',0,this.value,1)"><option'+(isX(r)?'':' selected')+'>O</option><option'+(isX(r)?' selected':'')+'>X</option></select></td>';
  if(s.form){h+='<td><div class="fgrid">'+s.cols.map(function(col){return '<label class="fl'+(col.w?' w2':'')+'"><span>'+col.h+'</span>'+fieldHTML(i,r,col)+'</label>';}).join('')+'</div></td>';}
  else s.cols.forEach(function(col){
    if(col.icon)h+='<td><button class="icbtn" onclick="openIcon('+i+',event)">'+(r[6]&&ICONS[r[6]]?svg(r[6]):'<span class="none">'+(s.k==='정보'?'자동':'선택')+'</span>')+'</button></td>';
    else if(col.photos){var fs=splitPh(r[col.c]);h+='<td><input value="'+esc(r[col.c])+'" oninput="upd('+i+','+col.c+',this.value)" onchange="buildEditor()"><div class="thumbs">'+fs.map(function(f){return '<img src="'+esc(photoURL(r,f))+'" data-f="'+esc(f)+'" onerror="imgFail(this)">';}).join('')+'<label class="tadd" title="사진 추가">📷<input type="file" accept="image/*" multiple onchange="addPh('+i+','+col.c+',this.files);this.value=\'\'"></label></div></td>';}
    else if(col.ta)h+='<td><textarea oninput="upd('+i+','+col.c+',this.value)">'+esc(r[col.c])+'</textarea></td>';
    else if(col.ro)h+='<td class="ro">'+esc(r[col.c])+'</td>';
    else h+='<td>'+fieldHTML(i,r,col)+'</td>';
  });
  return h+'<td>'+(s.fixed?'':'<button class="del" title="이 줄 삭제" onclick="delRow('+i+')">×</button>')+'</td></tr>';
}
function fieldHTML(i,r,col){
  var v=r[col.c]==null?'':r[col.c];
  if(col.opts){var o=(typeof col.opts==='function'?col.opts():col.opts).slice();if(o.indexOf(v)<0)o.push(v);return '<select onchange="upd('+i+','+col.c+',this.value)">'+o.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>';}
  if(col.ta)return '<textarea oninput="upd('+i+','+col.c+',this.value)">'+esc(v)+'</textarea>';
  return '<input value="'+esc(v)+'" oninput="upd('+i+','+col.c+',this.value)">';
}

/* ================= 행 조작 ================= */
function upd(i,c,v,rebuild){rows[i][c]=v;if(P.onEdit&&P.onEdit(rows[i],c))rebuild=1;mark();if(rebuild){buildEditor();render(true);}else render();}
function addRow(k,tab){
  var r=blank(tab,k), at=-1;
  rows.forEach(function(x,i){if(x[2]===k&&(x[1]||'')===(tab||''))at=i;});
  if(at<0&&tab)rows.forEach(function(x,i){if(x[1]===tab)at=i;});
  if(at>=0&&P.carry&&rows[at][1]===(tab||''))P.carry.forEach(function(c){r[c]=rows[at][c];});
  if(at<0)rows.push(r);else rows.splice(at+1,0,r);
  mark();buildEditor();render(true);
  setTimeout(function(){var el=document.querySelector('tr[data-i="'+rows.indexOf(r)+'"] input,tr[data-i="'+rows.indexOf(r)+'"] textarea');if(el)el.focus();},30);
}
function addPh(i,c,files){
  var list=splitPh(rows[i][c]);
  for(var n=0;n<files.length;n++){var f=files[n],name=f.name.replace(/\s+/g,'_');
    if(f.size>2*1024*1024)toast('⚠️ '+esc(f.name)+' 은(는) 2MB가 넘어요. 홈페이지가 느려질 수 있어요.',5000);
    fblobs.set(name,URL.createObjectURL(f));upFiles.set(name,f);if(list.indexOf(name)<0)list.push(name);}
  if(list.length>3)toast('⚠️ 사진은 3장까지만 보여요.',4000);
  upd(i,c,list.join(', '),1);
}
function delRow(i){var r=rows[i];if(blobs.get(r)){URL.revokeObjectURL(blobs.get(r));blobs.delete(r);}rows.splice(i,1);mark();buildEditor();render(true);}
var dragRow=null;
function rowStart(e,i){dragRow=i;e.dataTransfer.effectAllowed='move';e.target.closest('tr').classList.add('dragging');}
function rowEnd(){dragRow=null;document.querySelectorAll('tr.dragging,tr.over').forEach(function(t){t.classList.remove('dragging','over');});}
function same(a,b){return rows[a]&&rows[b]&&rows[a][2]===rows[b][2]&&rows[a][1]===rows[b][1];}
function rowOver(e,i){if(dragRow==null||!same(dragRow,i))return;e.preventDefault();e.currentTarget.classList.add('over');}
function rowDrop(e,i){e.preventDefault();var s=dragRow;rowEnd();if(s==null||s===i||!same(s,i))return;var tgt=rows[i],it=rows[s];rows.splice(s,1);rows.splice(rows.indexOf(tgt),0,it);mark();buildEditor();render(true);}
function movePhoto(i,d){var r=rows[i],sib=[];rows.forEach(function(x,j){if(x[2]==='사진'&&x[1]===r[1])sib.push(j);});var p=sib.indexOf(i),q=p+d;if(q<0||q>=sib.length)return;var j=sib[q];rows[i]=rows[j];rows[j]=r;mark();buildEditor();render(true);}
function addPhotos(files){
  if(!curTab){alert('먼저 '+P.tabWord+'을(를) 선택하거나 만들어 주세요.');return;}
  var at=-1;rows.forEach(function(x,i){if(x[1]===curTab)at=i;});
  for(var n=0;n<files.length;n++){
    var f=files[n],name=f.name.replace(/\s+/g,'_');
    if(f.size>2*1024*1024)toast('⚠️ '+esc(f.name)+' 은(는) 2MB가 넘어요. 홈페이지가 느려질 수 있어요.',5000);
    var r=blank(curTab,'사진');r[P.photo.file]=name;
    blobs.set(r,URL.createObjectURL(f));upFiles.set(name,f);
    if(at<0)rows.push(r);else rows.splice(++at,0,r);
  }
  mark();buildEditor();render(true);
}

/* ================= 탭 조작 ================= */
function bindTabbar(){
  var bar=document.getElementById('tabbar');if(!bar)return;
  var ad=document.getElementById('addtab');if(ad)ad.onclick=addTab;
  bar.querySelectorAll('.chip').forEach(function(ch){
    var t=ch.dataset.t;
    ch.addEventListener('click',function(e){if(e.target.dataset.del){delTab(t);return;}selectTab(t);});
    if(P.fixedTabs)return;
    ch.addEventListener('dblclick',function(){renameTab(t);});
    ch.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/tab',t);e.dataTransfer.effectAllowed='move';});
    ch.addEventListener('dragover',function(e){if(e.dataTransfer.types.indexOf('text/tab')<0)return;e.preventDefault();ch.classList.add('over');});
    ch.addEventListener('dragleave',function(){ch.classList.remove('over');});
    ch.addEventListener('drop',function(e){e.preventDefault();ch.classList.remove('over');moveTab(e.dataTransfer.getData('text/tab'),t);});
  });
}
function selectTab(t){curTab=t;buildEditor();render(true);lastHi={tab:rendered().indexOf(t),sel:'.sec,h1',pos:0};post(lastHi);}
function addTab(){
  var n=prompt('새 '+P.tabWord+' 이름을 적어 주세요.');if(!n||!n.trim())return;n=n.trim();
  if(tabNames().indexOf(n)>=0){alert('이미 있는 이름이에요.');return;}
  rows.push(blank(n,P.newTabKind||P.tab[0].k));curTab=n;mark();buildEditor();render(true);
}
function renameTab(o){
  var n=prompt(P.tabWord+' 이름을 바꿔 주세요.'+(P.renameNote?'\n'+P.renameNote:''),o);if(!n||!n.trim()||n.trim()===o)return;n=n.trim();
  if(tabNames().indexOf(n)>=0){alert('이미 있는 이름이에요.');return;}
  rows.forEach(function(r){if(r[1]===o)r[1]=n;});if(curTab===o)curTab=n;mark();buildEditor();render(true);
}
function delTab(t){
  var cnt=rows.filter(function(r){return r[1]===t;}).length;
  if(!confirm('"'+t+'" '+P.tabWord+'과(와) 그 안의 내용 '+cnt+'줄을 모두 지울까요?'))return;
  rows=rows.filter(function(r){if(r[1]===t&&blobs.get(r)){URL.revokeObjectURL(blobs.get(r));blobs.delete(r);}return r[1]!==t;});
  if(curTab===t)curTab='';mark();buildEditor();render(true);
}
function moveTab(src,dst){
  if(!src||src===dst)return;
  var mv=rows.filter(function(r){return r[1]===src;}),rest=rows.filter(function(r){return r[1]!==src;});
  var at=rest.findIndex(function(r){return r[1]===dst;});
  Array.prototype.splice.apply(rest,[at<0?rest.length:at,0].concat(mv));rows=rest;mark();buildEditor();render(true);
}

/* ================= 아이콘 팔레트 ================= */
var icRow=null,icBtn=null;
(function(){var p=document.getElementById('icpop'),h='<button class="none" onclick="setIcon(\'\')">✕ 아이콘 없음(자동)</button>';

function openIcon(i,ev){ev.stopPropagation();icRow=i;icBtn=ev.currentTarget;var p=document.getElementById('icpop');p.style.display='grid';var r=icBtn.getBoundingClientRect();

/* ================= 검증 ================= */
var PRIV=[[/\b01[016-9][-. ]?\d{3,4}[-. ]?\d{4}\b/,'휴대전화번호'],[/\b\d{6}-\d{7}\b/,'주민등록번호']];
function validate(){
  var errs=[],warns=[],top=kindsOf('top'),tab=kindsOf('tab'),all=top.concat(tab);
  rows.forEach(function(r,i){
    var ln=P.lineOf?P.lineOf(r,i):'엑셀 '+(i+5)+'행',k=r[2];
    if(!k){errs.push(ln+': 종류가 비었어요');return;}
    if(all.indexOf(k)<0){errs.push(ln+': 종류 "'+esc(k)+'"는 이 페이지에서 쓸 수 없어요 ('+all.join('·')+')');return;}
    if(!r[1]&&top.indexOf(k)<0){errs.push(ln+': '+P.tabWord+' 칸이 비어 있어요');return;}
    if(r[1]&&tab.indexOf(k)<0){errs.push(ln+': '+k+'는 페이지 공통 항목이라 탭 칸을 비워야 해요');return;}
    if(r[6]&&!ICONS[r[6]])errs.push(ln+': 아이콘 "'+esc(r[6])+'"는 목록에 없어요');
    P.fileFields.forEach(function(f){if(f.fill&&!r[f.slot])errs.push(ln+': '+f.h+' 칸이 비어 있어요');});
    var s=specOf(r); if(!s||isX(r))return;
    if(s.req&&!r[s.req])errs.push(ln+': '+s.label.replace(/ \(.*\)$/,'')+' 줄에는 '+(s.cols.filter(function(c){return c.c===s.req;})[0]||{h:'이름'}).h.replace(/ \(.*\)$/,'')+'이(가) 필요해요');
    if(s.need&&!r[s.need])warns.push(ln+': '+k+'의 이름이 비어 있어요');
    if(s.photo&&!pf(r))errs.push(ln+': 사진 파일명이 없어요');
    (s.cols||[]).forEach(function(col){if(col.photos&&splitPh(r[col.c]).length>3)warns.push(ln+': 사진은 3장까지만 보여요 (4장째부터 안 나와요)');});
    if(P.validateRow)P.validateRow(r,ln,errs,warns);
    if(P.privacy)PRIV.forEach(function(p){var m=r.join(' ').match(p[0]);if(m)errs.push(ln+': '+p[1]+'로 보이는 값이 있어요 → '+esc(m[0])+' (개인정보는 올릴 수 없어요)');});
  });
  var names=rendered();
  heights.forEach(function(h,i){if(h>2000)warns.push('탭 "'+esc(names[i]||i+1)+'"이(가) '+h+'px로 홈페이지 칸(2000px)을 넘어요. 내용을 줄이거나 탭을 나눠 주세요');});
  var b=document.getElementById('valbox');
  if(!rows.length){b.innerHTML='';return errs;}
  b.innerHTML=(errs.length?'<div class="val bad">⛔ 고쳐야 할 곳 '+errs.length+'개 (이대로 올리면 홈페이지가 바뀌지 않아요)<br>'+errs.join('<br>')+'</div>':'')
    +(warns.length?'<div class="val warn">⚠️ 확인해 주세요<br>'+warns.join('<br>')+'</div>':'')
    +(!errs.length&&!warns.length?'<div class="val ok">✅ 문제 없음 — 이대로 내려받아 올리면 돼요</div>':'')
    +(tplOld?'<div class="val warn">⚠️ GitHub의 '+P.html+'가 아직 옛날 버전이라 미리보기가 다르게 보일 수 있어요. 새 '+P.html+'를 먼저 올려 주세요.</div>':'');
  return errs;
}

/* ================= 미리보기 ================= */
function post(m){if(!m)return;var o={tab:m.tab,sel:m.sel,pos:m.pos};if(m.row){var s=specOf(m.row);if(s&&s.hiKey&&!isX(m.row))o.key=s.hiKey(m.row);o.tab=rendered().indexOf(m.row[1]);}
  try{document.getElementById('pv').contentWindow.postMessage({bwHi:o},'*');}catch(e){}}
function render(now){clearTimeout(renderTimer);if(now)doRender();else renderTimer=setTimeout(doRender,250);}
function doRender(){
  if(!tpl){validate();return;}
  lastDoc=P.build(rows,photoURL);
  validate();
  var ti=rendered().indexOf(curTab);
  var helper='<style>.bwhi{outline:5px solid #FF2D2D!important;outline-offset:4px;border-radius:14px;box-shadow:0 0 0 4px rgba(255,45,45,.22),0 0 26px rgba(255,45,45,.55)!important;animation:bwp 1.1s ease-in-out infinite;}@keyframes bwp{50%{outline-color:#ff9a9a}}</style>'
   +'<script>(function(){'
   +'function tab(i){if(i==null||i<0)return;var p=document.getElementById("tp"+i);if(p&&p.classList.contains("hidden")){var b=document.querySelectorAll(".seg button")[i];if(b)b.click();}}'
   +'function hi(m){if(!m)return;setTimeout(function(){document.querySelectorAll(".bwhi").forEach(function(x){x.classList.remove("bwhi");});if(window.__bwHi&&window.__bwHi(m))return;tab(m.tab);'
   +'var root=(m.tab!=null&&m.tab>=0)?document.getElementById("tp"+m.tab):document;if(!root)return;var el=root.querySelectorAll(m.sel)[m.pos||0];'
   +'if(el){if(el.tagName==="DETAILS")el.open=true;el.classList.add("bwhi");el.scrollIntoView({block:"center",behavior:"smooth"});}},70);}'
   +'function hs(){var ps=[].slice.call(document.querySelectorAll(".tabpanel")),w=document.querySelector(".wrap");if(!w)return;var cur=ps.findIndex(function(p){return !p.classList.contains("hidden");}),out=[];'
   +'if(!ps.length)out.push(Math.ceil(w.getBoundingClientRect().height)+12);else{ps.forEach(function(p,i){ps.forEach(function(q,j){q.classList.toggle("hidden",j!==i);});out.push(Math.ceil(w.getBoundingClientRect().height)+12);});ps.forEach(function(q,j){q.classList.toggle("hidden",j!==cur);});}'
   +'parent.postMessage({bwH:out,cur:Math.ceil(w.getBoundingClientRect().height)+20},"*");}'
   +'setTimeout(function(){tab(window.__TAB__);},20);window.addEventListener("message",function(e){if(e.data&&e.data.bwHi)hi(e.data.bwHi);});'
   +'setTimeout(hs,350);setTimeout(hs,1500);document.addEventListener("click",function(e){if(e.target.closest(".seg button"))setTimeout(hs,50);});'
   +'})();<\/script>';
  var inj='<script>window.__BW__='+JSON.stringify(lastDoc).replace(/</g,'\\u003c')+';window.__TAB__='+ti+';<\/script>';
  var pv=document.getElementById('pv');
  pv.onload=function(){if(lastHi)post(lastHi);};
  pv.srcdoc=tpl.replace('<body>','<body>'+inj).replace('</body>',helper+'</body>');
  sizePv(null);
}
function sizePv(h){
  var pv=document.getElementById('pv'),box=document.getElementById('pvbox'),w=dev==='pc'?1465:370;
  var sc=Math.min(1,box.clientWidth/w);pv._h=h||pv._h||1400;
  pv.style.width=w+'px';pv.style.height=(pv._h+40)+'px';pv.style.transform='scale('+sc+')';box.style.height=((pv._h+40)*sc)+'px';
}
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.bwH){heights=d.bwH;sizePv(d.cur);validate();
    var names=rendered();
    document.getElementById('hbox').innerHTML='· '+(heights.length>1?'탭별 ':'')+'높이('+(dev==='pc'?'PC':'모바일')+'): '+heights.map(function(h,i){return '<span class="'+(h>2000?'bad':'ok')+'">'+esc(heights.length>1?(names[i]||''):'페이지 전체')+' '+h+'px</span>';}).join(' / ');}
});
document.getElementById('editor').addEventListener('focusin',function(e){
  var tr=e.target.closest('[data-i]');if(!tr)return;var i=+tr.dataset.i,r=rows[i];if(!r)return;
  var s=specOf(r);if(!s||isX(r)||(s.hiIf&&!s.hiIf(r))||(s.photo&&!pf(r))){lastHi=null;return;}
  var pos=0;for(var j=0;j<i;j++){var x=rows[j];if(x[2]===r[2]&&x[1]===r[1]&&!isX(x)&&(!s.hiIf||s.hiIf(x))&&(!s.photo||pf(x)))pos++;}
  lastHi={tab:r[1]?rendered().indexOf(r[1]):-1,sel:s.hi,pos:pos,row:s.hiKey?r:null};post(lastHi);
});
document.getElementById('devseg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#devseg button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');dev=b.dataset.d;heights=[];render(true);});
window.addEventListener('resize',function(){sizePv(null);});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

/* ================= 엑셀 만들기 (내려받기·바로 올리기 공용) ================= */
var XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function makeWB(){
  if(P.writeWB)return P.writeWB(rows,origWB);
  var HEAD=P.map.map(function(m){return m[0];});
  var aoa=[[P.name+' 페이지 내용  —  한 줄 = 화면의 한 조각'],['"홈페이지 편집기"로 고친 파일입니다. 편집기로 여는 것을 권장합니다.'],[],HEAD]
    .concat(rows.map(function(r){return P.map.map(function(m){var v=r[m[1]];return v==null?'':v;});}));
  var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=HEAD.map(function(h){return{wch:/내용|설명/.test(h)?60:(/탭|라벨|이름|소제목/.test(h)?22:12)};});
  var g=P.guide?[['북원노인종합복지관 · '+P.name+' 페이지 관리표'],['이 파일은 "홈페이지 편집기"로 편집하는 것을 권장합니다.'],[]].concat(P.guide.map(function(x){return [x];})):[['북원노인종합복지관 · '+P.name+' 페이지 관리표'],['이 파일은 "홈페이지 편집기"로 편집하는 것을 권장합니다.'],[],
    ['■ 종류'+(P.top.length?'(탭 비움): '+kindsOf('top').join(' · '):': ')+(P.top.length?'':kindsOf('tab').join(' · '))],
    P.top.length?['■ 종류(탭 있음): '+kindsOf('tab').join(' · ')]:['■ 모든 줄에 탭 이름이 필요합니다.'],
    ['■ 사진 파일은 GitHub '+P.img+' 폴더에 같은 이름으로 올립니다.'],['■ 아이콘: '+Object.keys(ICONS).join(' ')],['■ 게시: O=보임 / X=숨김']];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,(origWB&&origWB.Sheets['사용법'])||XLSX.utils.aoa_to_sheet(g),'사용법');XLSX.utils.book_append_sheet(wb,ws,P.sheet);
  return wb;
}
function xlsxBytes(){return new Uint8Array(XLSX.write(makeWB(),{bookType:'xlsx',type:'array'}));}
function newPhotos(){  // 이번에 새로 고른 사진 중, 아직 내용에 쓰이고 있는 것만
  var used={};rows.forEach(function(r){if(isX(r))return;r.forEach(function(v){splitPh(v).forEach(function(f){used[f]=1;});});});
  var out=[];upFiles.forEach(function(f,n){if(used[n])out.push({name:n,file:f});});return out;
}
document.getElementById('dl').addEventListener('click',function(){
  if(!rows.length){alert('먼저 내용을 불러와 주세요.');return;}
  if(validate().length&&!confirm('고쳐야 할 곳이 남아 있어요. 이대로 올리면 홈페이지가 바뀌지 않아요(자동 검사에서 멈춤). 그래도 내려받을까요?'))return;
  var fname=P.xlsx.split('/').pop(),blob=new Blob([xlsxBytes()],{type:XMIME});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  dirty=false;
  var news=newPhotos().map(function(x){return x.name;});
  toast('💾 <b>'+fname+'</b> 내려받았어요 → GitHub <b>'+P.xlsx+'</b>에 덮어쓰기'+(news.length?'<br>📷 새 사진 '+news.length+'장도 <b>'+P.img+'</b>에 올려 주세요: '+news.map(esc).join(', '):''),9000);
});

/* ================= GitHub에 바로 올리기 =================
   담당자 PC에 'GitHub 토큰'(이 저장소 Contents 읽기·쓰기 권한만)을 한 번 붙여넣어 두면,
   엑셀 + 새 사진을 커밋 1번으로 올린다 → GitHub Actions가 1~2분 안에 홈페이지에 반영. */
var GH_API=QS.get('api')||'https://api.github.com', GH_BRANCH='main';
function ghToken(){try{return localStorage.getItem('bw_gh_token')||'';}catch(e){return '';}}
function ghSetToken(v){try{if(v)localStorage.setItem('bw_gh_token',v);else localStorage.removeItem('bw_gh_token');}catch(e){}}
function ghStatus(){var on=!!ghToken();document.getElementById('ghst').textContent=on?'연결됨':'관리자 설정';document.getElementById('ghset').classList.toggle('ok',on);document.getElementById('ghup').classList.toggle('off',!on);}
function gh(method,path,body){
  return fetch(GH_API+'/repos/'+repoName()+path,{method:method,headers:{'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e;}return j;});});
}
function ghErr(e){
  if(e.status===401)return '토큰이 맞지 않거나 기한이 지났어요. 관리자에게 다시 연결을 요청해 주세요 ([⚙ 관리자 설정]).';
  if(e.status===403||e.status===404)return '이 토큰에 저장소 쓰기 권한이 없어요. 토큰 권한(Contents: Read and write, 저장소 '+repoName()+')을 확인해 주세요.';
  if(e.status===422||e.status===409)return '그사이 다른 사람이 먼저 올렸어요. 잠시 뒤 다시 눌러 주세요.';
  return '올리지 못했어요 ('+esc(e.message||e)+'). 인터넷 연결을 확인하거나 [엑셀 내려받기]로 올려 주세요.';
}
document.getElementById('ghset').addEventListener('click',function(){
  var cur=ghToken();
  var v=prompt('【관리자용】\n'+(cur?'지금 이 PC는 홈페이지(GitHub)에 연결돼 있어요.\n새 토큰을 붙여넣으면 바뀌고, 비우고 확인하면 연결이 해제돼요.\n\n':'')+'GitHub 토큰을 붙여넣어 주세요 (github_pat_로 시작).\n※ 이 PC의 이 브라우저에만 저장돼요. 공용 PC에서는 쓰지 마세요.',cur?'':'');
  if(v===null)return;v=v.trim();
  if(!v){ghSetToken('');ghStatus();toast('GitHub 연결을 해제했어요.');return;}
  ghSetToken(v);ghStatus();
  gh('GET','').then(function(j){
    if(j.permissions&&j.permissions.push===false)throw {status:403};
    toast('✅ GitHub 연결 완료 ('+esc(j.full_name||repoName())+')');
  }).catch(function(e){ghSetToken('');ghStatus();alert(ghErr(e));});
});
function b64(bytes){var s='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(s);}
function fileBytes(f){  // 1MB 넘는 jpg는 가로·세로 1600px 이하로 줄여서 올림
  var big=f.size>1024*1024&&/jpe?g$/i.test(f.name);
  if(!big)return f.arrayBuffer().then(function(b){return new Uint8Array(b);});
  return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){
      var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b.arrayBuffer().then(function(a){res(new Uint8Array(a));});},'image/jpeg',0.85);};
    img.onerror=function(){f.arrayBuffer().then(function(b){res(new Uint8Array(b));});};img.src=u;});
}
var ghBusy=false;
document.getElementById('ghup').addEventListener('click',function(){
  if(!rows.length){alert('먼저 내용을 불러와 주세요.');return;}
  if(!ghToken()){alert('이 PC는 아직 홈페이지와 연결되지 않았어요.\n\n관리자에게 "편집기 연결"을 한 번 요청해 주세요. (1분이면 끝나요)\n급하면 [💾 엑셀로 저장]을 눌러 저장한 파일을 관리자에게 보내 주세요.');return;}
  var errs=validate();if(errs.length){alert('고쳐야 할 곳이 '+errs.length+'개 있어요. 빨간 상자 내용을 먼저 고쳐 주세요.');return;}
  if(ghBusy)return;
  var ph=newPhotos();
  if(!confirm(P.name+' 페이지를 홈페이지에 올릴까요?\n\n· 엑셀: '+P.xlsx+(ph.length?'\n· 새 사진 '+ph.length+'장: '+ph.map(function(x){return x.name;}).join(', '):'')+'\n\n올리면 1~2분 뒤 홈페이지가 바뀌어요.'))return;
  ghBusy=true;var btn=document.getElementById('ghup');btn.disabled=true;btn.textContent='⏳ 올리는 중…';
  var items=[{path:P.xlsx,bytes:xlsxBytes()}];
  Promise.all(ph.map(function(x){return fileBytes(x.file).then(function(b){return {path:P.img+x.name,bytes:b};});})).then(function(pics){
    items=items.concat(pics);
    function attempt(n){
      var base;
      return gh('GET','/git/ref/heads/'+GH_BRANCH).then(function(ref){base=ref.object.sha;return gh('GET','/git/commits/'+base);})
        .then(function(c){return Promise.all(items.map(function(it){return gh('POST','/git/blobs',{content:b64(it.bytes),encoding:'base64'}).then(function(b){return {path:it.path,mode:'100644',type:'blob',sha:b.sha};});}))
          .then(function(tree){return gh('POST','/git/trees',{base_tree:c.tree.sha,tree:tree});});})
        .then(function(tr){return gh('POST','/git/commits',{message:'편집기: '+P.name+' 수정'+(pics.length?' (사진 '+pics.length+'장)':''),tree:tr.sha,parents:[base]});})
        .then(function(cm){return gh('PATCH','/git/refs/heads/'+GH_BRANCH,{sha:cm.sha});})
        .catch(function(e){if(n<2&&(e.status===422||e.status===409))return attempt(n+1);throw e;});
    }
    return attempt(0);
  }).then(function(){
    dirty=false;upFiles.clear();
    toast('✅ 홈페이지에 올렸어요. 1~2분 뒤 반영돼요.<br><a href="https://github.com/'+repoName()+'/actions" target="_blank" style="color:#ffd8a8">진행 상황 보기 ›</a>',12000);
  }).catch(function(e){alert(ghErr(e));})
  .then(function(){ghBusy=false;btn.disabled=false;btn.textContent='⬆ 홈페이지에 올리기';});
});
ghStatus();

setPage(QS.get('page')&&PAGES[QS.get('page')]?QS.get('page'):'volunteer');
</script>
